name: SIGMA Debug - Windows v441 Isolation

on:
  push:
    branches:
      - debug/windows-v441-isolation
  workflow_dispatch:

jobs:
  isolate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Run isolated regression segment
        shell: pwsh
        run: python -m pytest -vv tests/test_v439_incident_automation.py tests/test_v440_fleet.py tests/test_v441_update_agent.py
