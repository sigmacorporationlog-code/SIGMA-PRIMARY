name: SIGMA V441 Residue Diagnostic

on:
  push:
    branches: [fix/ci-v4.46.0-windows-android]
  workflow_dispatch:

jobs:
  windows-v441-diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Process snapshot before suite
        shell: pwsh
        run: |
          Write-Host "=== PROCESS SNAPSHOT BEFORE ==="
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match '^(python|pytest|java|gradle|powershell|cmd)(\.exe)?$' } |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine |
            Format-Table -AutoSize
      - name: Full suite with full traceback
        shell: pwsh
        run: python -m pytest -q --full-trace
      - name: Process snapshot after suite
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== PROCESS SNAPSHOT AFTER ==="
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match '^(python|pytest|java|gradle|powershell|cmd)(\.exe)?$' } |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine |
            Format-Table -AutoSize
