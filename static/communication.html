<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Communication</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><h2 class="page-title">Communication</h2><p class="page-subtitle">SMS ciblés : parent, classe, niveau, section ou établissement</p><div id="context-bar"></div><div class="panel"><h3>Nouvel envoi</h3><div class="form-grid"><div class="field"><label>Cible</label><select id="target-type" onchange="loadTargetOptions()"><option value="guardian">Parent / tuteur</option><option value="class">Classe</option><option value="level">Niveau</option><option value="stream">Section / série</option><option value="school">Tout l'établissement</option></select></div><div class="field" id="target-wrap"><label>Destinataire</label><select id="target-id"></select></div></div><div class="field"><label>Message</label><textarea id="sms-body" rows="5" maxlength="480" placeholder="Votre message..."></textarea></div><button class="btn accent" onclick="sendTargeted()">Envoyer le SMS</button><div id="sms-error" class="form-error"></div></div><div class="panel"><div class="form-row" style="justify-content:space-between"><h3 style="margin:0">Historique</h3><button class="btn ghost sm" onclick="loadLogs()">Actualiser</button></div><table class="sigma-table"><thead><tr><th>Destinataire</th><th>Message</th><th>Statut</th><th>Date</th></tr></thead><tbody id="logs-body"></tbody></table></div><section id="sigma-connect-v31" class="panel" style="margin-top:24px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h3 style="margin:0">SIGMA Connect</h3><p style="margin:6px 0 0;opacity:.72">Un même message, plusieurs canaux, traçabilité de bout en bout.</p></div><button class="btn ghost sm" type="button" onclick="loadSigmaConnect()">Actualiser</button></div><div id="sigma-connect-summary" style="margin-top:16px">Chargement…</div></section></div></main><footer class="sigma-footer">SIGMA — Système Intégré de Gestion et Management Académique</footer><script src="/dashboard/assets/sigma-offline.js"></script><script src="/dashboard/assets/sigma.js"></script><script>
async function loadTargetOptions(){const ctx=Sigma.context.get(),type=document.getElementById('target-type').value,wrap=document.getElementById('target-wrap'); if(type==='school'){wrap.style.display='none';return} wrap.style.display='block'; let data=[]; if(type==='guardian') data=await Sigma.api(`/api/guardians?school_id=${ctx.school_id}`); else if(type==='class') data=await Sigma.api(`/api/classes?school_id=${ctx.school_id}&academic_year_id=${ctx.academic_year_id}`); else if(type==='level') data=await Sigma.api(`/api/levels?school_id=${ctx.school_id}`); else data=await Sigma.api(`/api/streams?school_id=${ctx.school_id}`); document.getElementById('target-id').innerHTML=data.map(x=>`<option value="${Number(x.id)}">${Sigma.escapeHtml(x.name||x.label||((x.relationship_type||'')+': '+(x.name||'')))}</option>`).join('')||'<option value="">Aucun destinataire</option>';}
async function sendTargeted(){const ctx=Sigma.context.get(),type=document.getElementById('target-type').value,body=document.getElementById('sms-body').value.trim(),err=document.getElementById('sms-error');err.textContent='';if(!body){err.textContent='Le message est obligatoire.';return}try{if(type==='guardian') await Sigma.postJson('/api/sms/send-to-guardian',{school_id:+ctx.school_id,guardian_id:+document.getElementById('target-id').value,body});else{await Sigma.postJson('/api/sms/send-to-target',{school_id:+ctx.school_id,target_type:type,target_id:type==='school'?null:+document.getElementById('target-id').value,body});} Sigma.toast('Envoi effectué');document.getElementById('sms-body').value='';loadLogs()}catch(e){err.textContent=e.message}}
async function loadLogs(){const ctx=Sigma.context.get();const logs=await Sigma.api(`/api/sms/logs?school_id=${ctx.school_id}`);document.getElementById('logs-body').innerHTML=logs.map(l=>{const status=String(l.status||'');const cls=status==='sent'?'green':status==='failed'?'red':'grey';return `<tr><td>${Sigma.escapeHtml(l.recipient_label||l.recipient_phone)}</td><td>${Sigma.escapeHtml(l.body)}</td><td><span class="badge ${cls}">${Sigma.escapeHtml(status)}</span></td><td>${Sigma.escapeHtml(l.sent_at||'—')}</td></tr>`}).join('')||'<tr><td colspan="4">Aucun SMS.</td></tr>'}
async function loadSigmaConnect(){const el=document.getElementById('sigma-connect-summary');if(!el)return;try{const ctx=Sigma.context.get();if(!ctx.school_id){el.textContent='Sélectionnez un établissement.';return;}const data=await Sigma.api('/api/connect/campaigns?school_id='+encodeURIComponent(ctx.school_id));el.innerHTML='<strong>'+Number(data.length)+'</strong> campagne(s) récente(s)';}catch(e){el.textContent='SIGMA Connect : '+e.message;}}
Sigma.boot('/dashboard/communication.html',async()=>{await Sigma.renderContextBar('context-bar',{showClass:false,showPeriod:false},async()=>{await loadLogs();await loadTargetOptions();await loadSigmaConnect();});await loadTargetOptions();await loadSigmaConnect();});</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/dashboard/sw.js").catch(()=>{});}</script></body></html>
