<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Tableau d’honneur</title><link rel="stylesheet" href="/dashboard/assets/sigma.css"><style>
.grid{display:grid;grid-template-columns:1fr 1.6fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.muted{color:#64748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}.notice{padding:10px;background:#f8fafc;border-radius:10px;margin-bottom:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><h1 id="title"></h1><p class="muted" id="description"></p><div class="grid"><section class="card"><h2 id="rules-title"></h2><div id="rules"></div><hr><h3 id="form-title"></h3><div class="field"><label id="label-name"></label><input id="rule-name"></div><div class="row"><div class="field"><label id="label-min"></label><input id="min-average" type="number" min="0" max="20" step="0.01" value="14"></div><div class="field"><label id="label-absences"></label><input id="max-absences" type="number" min="0" step="1" value="2"></div></div><div class="actions"><button class="btn" onclick="createRule()" id="create-btn"></button></div></section><section class="card"><div class="notice" id="notice"></div><div class="row"><div class="field"><label id="label-period"></label><input id="period-id" type="number" min="1"></div><div class="field"><label id="label-class"></label><input id="class-id" type="number" min="1"></div></div><div class="actions"><button class="btn" onclick="previewBoard()" id="preview-btn"></button><button class="btn accent" onclick="generateBoard()" id="generate-btn"></button><button class="btn ghost" onclick="exportPdf()" id="pdf-btn"></button><button class="btn ghost" onclick="showHistory()" id="history-btn"></button><button class="btn ghost" onclick="validateBoard()" id="validate-btn"></button><button class="btn ghost" onclick="exportCsv()" id="csv-btn"></button></div><div id="result" style="margin-top:16px"></div></section></div></div></main><script src="/dashboard/assets/sigma.js"></script><script>
let rules=[]; let selectedRule=null;
function t(k){return Sigma.t(k)}
function labels(){document.getElementById('title').textContent=t('honor.title');document.title='SIGMA — '+t('honor.title');document.getElementById('description').textContent=t('honor.description');document.getElementById('notice').textContent=t('honor.notice');document.getElementById('label-period').textContent=t('honor.period_id');document.getElementById('label-class').textContent=t('honor.class_id_optional');document.getElementById('csv-btn').textContent=t('honor.csv');document.getElementById('rules-title').textContent=t('honor.rules');document.getElementById('form-title').textContent=t('honor.new_rule');document.getElementById('label-name').textContent=t('honor.name');document.getElementById('label-min').textContent=t('honor.min_average');document.getElementById('label-absences').textContent=t('honor.max_absences');document.getElementById('preview-btn').textContent=t('honor.preview');document.getElementById('generate-btn').textContent=t('honor.generate');document.getElementById('pdf-btn').textContent=t('honor.pdf');document.getElementById('history-btn').textContent=t('honor.history');document.getElementById('validate-btn').textContent=t('honor.validate');document.getElementById('create-btn').textContent=t('honor.new_rule')}
async function loadRules(){rules=await Sigma.api('/api/honor-board/rules');const host=document.getElementById('rules');host.innerHTML=rules.length?rules.map(r=>`<button class="btn ghost sm" style="margin:4px" onclick="selectRule(${Number(r.id)})">${Sigma.escapeHtml(r.name)}</button>`).join(''):`<div class="muted">${Sigma.escapeHtml(t('honor.no_entries'))}</div>`;if(rules.length&&!selectedRule)selectRule(rules[0].id)}
function selectRule(id){selectedRule=rules.find(r=>r.id===id)||null;if(selectedRule){document.getElementById('rule-name').value=selectedRule.name;document.getElementById('min-average').value=selectedRule.criteria?.min_average??14;document.getElementById('max-absences').value=selectedRule.criteria?.max_unjustified_absences??2}}
async function createRule(){const name=document.getElementById('rule-name').value.trim();if(!name)return Sigma.toast(t('honor.name_required'),'error');const criteria={min_average:Number(document.getElementById('min-average').value||0),max_unjustified_absences:Number(document.getElementById('max-absences').value||0),exclude_statuses:['excluded','dropped_out']};selectedRule=await Sigma.api('/api/honor-board/rules',{method:'POST',body:JSON.stringify({name,criteria})});await loadRules();selectRule(selectedRule.id)}
async function previewBoard(){if(!selectedRule)return Sigma.toast(t('honor.select_rule'),'error');const period=Number(document.getElementById('period-id').value);if(!period)return Sigma.toast(t('honor.period_required'),'error');const classId=Number(document.getElementById('class-id').value)||null;const data=await Sigma.api(`/api/honor-board/${selectedRule.id}/preview`,{method:'POST',body:JSON.stringify({academic_period_id:period,class_id:classId,preview:true})});render(data.entries,false)}
async function generateBoard(){if(!selectedRule)return Sigma.toast(t('honor.select_rule'),'error');const period=Number(document.getElementById('period-id').value);if(!period)return Sigma.toast(t('honor.period_required'),'error');const classId=Number(document.getElementById('class-id').value)||null;const data=await Sigma.api(`/api/honor-board/${selectedRule.id}/generate`,{method:'POST',body:JSON.stringify({academic_period_id:period,class_id:classId,preview:false})});render(data.entries,false)}
async function validateBoard(){if(!selectedRule)return Sigma.toast(t('honor.select_rule'),'error');const period=Number(document.getElementById('period-id').value);if(!period)return Sigma.toast(t('honor.period_required'),'error');const classId=Number(document.getElementById('class-id').value)||null;const qs=classId?`?academic_period_id=${period}&class_id=${classId}`:`?academic_period_id=${period}`;const data=await Sigma.api(`/api/honor-board/${selectedRule.id}/validate${qs}`,{method:'POST'});Sigma.toast(`${t('honor.validated')}: ${data.count}`,'success');await loadHistory()}
async function showHistory(){if(!selectedRule)return Sigma.toast(t('honor.select_rule'),'error');await loadHistory()}
async function loadHistory(){if(!selectedRule)return;const rows=await Sigma.api(`/api/honor-board/${selectedRule.id}/history`);const host=document.getElementById('result');host.innerHTML=rows.length?`<table><thead><tr><th>${t('honor.period')}</th><th>${t('honor.entry_count')}</th><th>${t('honor.generated_at')}</th><th>${t('honor.validation_state')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${Sigma.escapeHtml(r.period_name)}</td><td>${Number(r.entry_count)}</td><td>${Sigma.escapeHtml(r.generated_at||'')}</td><td>${r.is_validated?Sigma.escapeHtml(t('honor.validated')):Sigma.escapeHtml(t('honor.pending'))}</td></tr>`).join('')}</tbody></table>`:`<div class="muted">${Sigma.escapeHtml(t('honor.no_history'))}</div>`}
async function exportCsv(){if(!selectedRule)return Sigma.toast(t('honor.select_rule'),'error');const period=Number(document.getElementById('period-id').value);if(!period)return Sigma.toast(t('honor.period_required'),'error');const r=await fetch(`/api/honor-board/${selectedRule.id}/csv?academic_period_id=${period}`,{credentials:'same-origin'});if(!r.ok)return Sigma.toast('Export CSV impossible','error');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`honor-board-${selectedRule.id}-${period}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function exportPdf(){if(!selectedRule)return Sigma.toast(t('honor.select_rule'),'error');const period=Number(document.getElementById('period-id').value);if(!period)return Sigma.toast(t('honor.period_required'),'error');const r=await fetch(`/api/honor-board/${selectedRule.id}/pdf?academic_period_id=${period}`,{credentials:'same-origin'});if(!r.ok)return Sigma.toast('Export PDF impossible','error');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`honor-board-${selectedRule.id}-${period}.pdf`;a.click();URL.revokeObjectURL(a.href)}
function render(rows,validated){const host=document.getElementById('result');host.innerHTML=rows.length?`<table><thead><tr><th>${t('honor.rank')}</th><th>${t('honor.matricule')}</th><th>${t('honor.student')}</th><th>${t('honor.class_name')}</th><th>${t('honor.average')}</th><th>${t('honor.absences_short')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${Number(r.rank)}</td><td>${Sigma.escapeHtml(r.matricule)}</td><td>${Sigma.escapeHtml(r.student_name)}</td><td>${Sigma.escapeHtml(r.class_name)}</td><td>${Number(r.score).toFixed(2)}</td><td>${Number(r.unjustified_absences||0)}</td></tr>`).join('')}</tbody></table>`:`<div class="muted">${Sigma.escapeHtml(t('honor.no_entries'))}</div>`}
Sigma.boot('/dashboard/honor-board.html',async()=>{labels();try{await loadRules()}catch(e){Sigma.toast(e.message,'error')}});
</script></body></html>
