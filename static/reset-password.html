<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Réinitialiser le mot de passe</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"></head><body><main class="sigma-main" style="max-width:620px;margin:60px auto"><div class="panel"><h2>🔑 Réinitialiser le mot de passe</h2><div class="field"><label>Nouveau mot de passe</label><input id="next" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmer</label><input id="confirm" type="password" autocomplete="new-password"></div><button class="btn" id="save">Réinitialiser</button><div id="msg" class="form-error"></div></div></main><script>
const token=new URLSearchParams(location.search).get('token')||'';document.getElementById('save').onclick=async()=>{const m=document.getElementById('msg');m.textContent='';const next=document.getElementById('next').value,confirm=document.getElementById('confirm').value;if(next!==confirm){m.textContent='Les deux mots de passe sont différents.';return;}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:next})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Erreur');m.className='';m.textContent='Mot de passe réinitialisé. Vous pouvez vous connecter.';setTimeout(()=>location.href='/dashboard/',1200);}catch(e){m.textContent=e.message;}};
</script></body></html>
