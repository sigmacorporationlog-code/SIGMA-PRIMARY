<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Control Center</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px}.critical{font-weight:700}.muted{color:#667085}</style></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><h1>SIGMA Control Center</h1><p class="muted">Supervision production, SaaS et incidents</p><div id="cards" class="grid"></div><h2>Incidents ouverts</h2><div id="incidents"></div></div></main><script src="/dashboard/assets/sigma.js"></script><script>
async function load(){try{const d=await Sigma.api('/api/operations/control-center');document.getElementById('cards').innerHTML=[['Établissements',d.schools.total],['Abonnements actifs',d.schools.active_subscriptions],['Incidents ouverts',d.incidents.open],['Incidents critiques',d.incidents.critical],['Readiness',d.readiness.status],['Santé',d.health.status]].map(x=>`<div class="card"><div class="muted">${Sigma.escapeHtml(x[0])}</div><h2>${Sigma.escapeHtml(x[1])}</h2></div>`).join('');document.getElementById('incidents').innerHTML=d.incidents.recent.length?d.incidents.recent.map(x=>`<div class="card"><span class="critical">${Sigma.escapeHtml(String(x.severity||'').toUpperCase())}</span> — ${Sigma.escapeHtml(x.title)}<div class="muted">${Sigma.escapeHtml(x.category)} · école ${Sigma.escapeHtml(x.school_id??'plateforme')} · ${Sigma.escapeHtml(x.detected_at)}</div></div>`).join(''):'<p>Aucun incident ouvert.</p>';}catch(e){document.getElementById('incidents').textContent='Accès indisponible : '+e.message;}}
Sigma.boot('/dashboard/operations.html',load);
</script></body></html>
