<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Changer le mot de passe</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"></head><body><main class="sigma-main" style="max-width:620px;margin:60px auto"><div class="panel"><h2>🔐 Sécurisation du compte</h2><p>Pour continuer, définissez un nouveau mot de passe d'au moins 15 caractères.</p><div class="field"><label>Mot de passe actuel</label><input id="current" type="password" autocomplete="current-password"></div><div class="field"><label>Nouveau mot de passe</label><input id="next" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmer</label><input id="confirm" type="password" autocomplete="new-password"></div><button class="btn" id="save">Modifier le mot de passe</button><div id="msg" class="form-error"></div></div></main><script src="/dashboard/assets/sigma.js"></script><script>
(async()=>{ if(!await Sigma.refresh()){location.href='/dashboard/';return;} document.getElementById('save').onclick=async()=>{const m=document.getElementById('msg');m.textContent='';const current=document.getElementById('current').value,next=document.getElementById('next').value,confirm=document.getElementById('confirm').value;if(next!==confirm){m.textContent='Les deux nouveaux mots de passe sont différents.';return;}try{const r=await fetch('/api/auth/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Authorization:'Bearer '+Sigma.token()},body:JSON.stringify({current_password:current,new_password:next})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Erreur');m.className='';m.textContent='Mot de passe modifié. Redirection…';setTimeout(()=>location.href='/dashboard/',600);}catch(e){m.textContent=e.message;}};})();
</script></body></html>
