<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Pilote école</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{padding:16px;background:#f8fafc;border-radius:10px}.ok{color:#147a42}.bad{color:#b42318}button{border:0;border-radius:9px;padding:11px 16px;background:#17202a;color:#fff;cursor:pointer}input{padding:10px;border:1px solid #ccd3da;border-radius:8px}.check{padding:8px 0;border-bottom:1px solid #eee}.small{color:#667085;font-size:.9rem}</style></head>
<body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="wrap"><h1>🏫 SIGMA — Pilote école</h1><p class="small">Assistant de préparation et de contrôle avant utilisation réelle.</p>
<div class="card"><label>School ID <input id="school" type="number" min="1"></label> <button onclick="refresh()">Actualiser</button></div>
<div id="summary" class="card">Connexion requise.</div>
<div class="card"><h2>Préparer le pilote</h2><p class="small">Cette opération configure l'année scolaire, les périodes, les profils RBAC et crée une première sauvegarde de sécurité.</p><div class="grid"><input id="year" placeholder="2026/2027" value="2026/2027"><input id="start" type="date" value="2026-09-01"><input id="end" type="date" value="2027-06-30"><input id="periods" type="number" min="1" max="6" value="3"></div><br><button onclick="prepare()">Préparer le pilote</button><span id="msg" class="small"></span></div></div>
<script src="/dashboard/assets/sigma.js"></script><script>
const $=id=>document.getElementById(id); function sid(){return Number($('school').value)}
async function refresh(){const id=sid();if(!id)return;try{const d=await Sigma.api(`/api/pilot/${id}/readiness`);let checks=Object.entries(d.checks).map(([k,v])=>`<div class="check ${v?'ok':'bad'}">${v?'✓':'✗'} ${Sigma.escapeHtml?Sigma.escapeHtml(k):k}</div>`).join('');$('summary').innerHTML=`<h2>${d.ready_for_pilot?'🟢 PRÊT POUR LE PILOTE':'🟠 PRÉPARATION INCOMPLÈTE'}</h2><div class="grid">${Object.entries(d.counts).map(([k,v])=>`<div class="metric"><b>${Number(v)}</b><br>${Sigma.escapeHtml?Sigma.escapeHtml(k):k}</div>`).join('')}</div><h3>Contrôles</h3>${checks}${d.next_actions.length?'<h3>Actions restantes</h3><ul>'+d.next_actions.map(x=>`<li>${Sigma.escapeHtml?Sigma.escapeHtml(x):x}</li>`).join('')+'</ul>':''}`;}catch(e){$('summary').textContent=e.message}}
async function prepare(){const id=sid();if(!id)return;$('msg').textContent=' Préparation…';try{const d=await Sigma.api(`/api/pilot/${id}/prepare`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({year_label:$('year').value,start:$('start').value,end:$('end').value,period_count:Number($('periods').value)})});$('msg').textContent=' Terminé.';refresh();}catch(e){$('msg').textContent=' '+e.message}}
Sigma.boot('/dashboard/pilot.html',()=>refresh());
</script></div></main></body></html>
