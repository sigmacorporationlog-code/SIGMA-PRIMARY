<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA Intelligence — Centre de contrôle</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><style>
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.sub,.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;box-shadow:0 3px 12px #0000000a}.value{font-size:26px;font-weight:800;margin-top:5px}.label{font-size:12px;color:#64748b}.layout{display:grid;grid-template-columns:1.6fr .8fr;gap:16px;margin-top:16px}.proposal{border:1px solid #e5e7eb;border-radius:12px;padding:15px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:12px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2ff}.proposed{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.executed{background:#dbeafe;color:#1e40af}.rejected,.expired{background:#f1f5f9;color:#475569}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.empty{padding:24px;text-align:center;color:#64748b}.notice{padding:12px;border-radius:10px;margin-top:12px;background:#f8fafc}.notice.warn{background:#fff7ed;color:#9a3412}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><div class="head"><div><h1>🤖 SIGMA INTELLIGENCE</h1><div class="sub">Centre de contrôle des recommandations et actions IA.</div></div><div><button class="btn ghost" onclick="load()">Actualiser</button></div></div><div id="scope" class="muted">Chargement…</div><div id="kpis" class="grid" style="margin-top:14px"></div><div class="layout"><section class="card"><div class="top"><div><h2>Actions IA</h2><div class="muted">Chaque action reste soumise à validation humaine.</div></div></div><div id="proposals"></div></section><aside class="card"><h2>Garde-fous</h2><div id="guardrails"></div><div class="notice">🔐 L'IA ne dispose pas d'un accès SQL direct. Les actions passent par les services SIGMA et restent isolées par établissement.</div></aside></div></div></main><script src="/dashboard/assets/sigma.js"></script><script>
const esc=v=>Sigma.escapeHtml(v);function fmtDate(s){if(!s)return '—';try{return new Date(s).toLocaleString('fr-FR')}catch{return String(s)}}
async function approve(id){try{await Sigma.api(`/api/ai/actions/proposals/${id}/approve`,{method:'POST'});await load()}catch(e){Sigma.toast(e.message,'error')}}
async function reject(id){const reason=prompt('Motif du refus (facultatif) :');if(reason===null)return;try{await Sigma.api(`/api/ai/actions/proposals/${id}/reject`,{method:'POST',body:JSON.stringify({reason})});await load()}catch(e){Sigma.toast(e.message,'error')}}
async function execute(id){if(!confirm('Exécuter cette action approuvée ? Cette opération peut produire un effet réel.'))return;try{await Sigma.api(`/api/ai/actions/proposals/${id}/execute`,{method:'POST'});await load()}catch(e){Sigma.toast(e.message,'error')}}
function renderProposal(x){const status=String(x.status||'');let buttons='';if(status==='proposed')buttons=`<button class="btn sm" onclick="approve(${Number(x.id)})">✓ Approuver</button><button class="btn ghost sm" onclick="reject(${Number(x.id)})">Refuser</button>`;if(status==='approved')buttons=`<button class="btn sm" onclick="execute(${Number(x.id)})">▶ Exécuter</button>`;return `<article class="proposal"><div class="top"><div><strong>${esc(x.title)}</strong><div class="muted">${esc(x.description||x.action_type)}</div></div><span class="pill ${esc(status)}">${esc(status)}</span></div><div class="muted" style="margin-top:8px">Créée le ${esc(fmtDate(x.created_at))} · Expire le ${esc(fmtDate(x.expires_at))}</div>${buttons?`<div class="actions">${buttons}</div>`:''}</article>`}
async function load(){try{const d=await Sigma.api('/api/ai/actions/control-center?limit=50');document.getElementById('scope').textContent=d.scope.superadmin?'Périmètre : tous les établissements (superadmin)':`Périmètre : établissement #${d.scope.school_id}`;const c=d.counts;document.getElementById('kpis').innerHTML=[['Proposées',c.proposed],['Approuvées',c.approved],['Exécutées',c.executed],['Refusées',c.rejected],['Expirées',c.expired]].map(x=>`<div class="card"><div class="label">${esc(x[0])}</div><div class="value">${Number(x[1]||0)}</div></div>`).join('');document.getElementById('proposals').innerHTML=d.proposals.length?d.proposals.map(renderProposal).join(''):'<div class="empty">Aucune proposition IA récente.</div>';document.getElementById('guardrails').innerHTML=`<p>Exécution système : <strong>${d.execution.enabled?'activée':'désactivée'}</strong></p><p>Votre droit d'exécution : <strong>${d.execution.can_execute?'oui':'non'}</strong></p><p>Maximum de destinataires : <strong>${Number(d.execution.max_recipients)}</strong></p>${d.execution.enabled?'<div class="notice warn">⚠️ Une action approuvée peut produire un effet réel. Vérifiez toujours les destinataires et le contenu.</div>':'<div class="notice">✓ L’exécution IA est actuellement bloquée par configuration.</div>'}`;}catch(e){document.getElementById('scope').textContent='Impossible de charger le centre IA : '+e.message;}}
Sigma.boot('/dashboard/ai-control.html',load);
</script></body></html>
