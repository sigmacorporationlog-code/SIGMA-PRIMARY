<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA Insight</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><style>
.insight-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.sub{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0000000a}.value{font-size:28px;font-weight:800;margin-top:6px}.label{font-size:13px;color:#64748b}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eef2f7}.pill{padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}.critical{background:#fee2e2;color:#991b1b}.warning{background:#fef3c7;color:#92400e}.normal{background:#dcfce7;color:#166534}.action{padding:13px;border:1px solid #e5e7eb;border-radius:10px;margin:10px 0}.action a{display:inline-block;margin-top:7px}.muted{color:#64748b;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><div class="insight-head"><div><h1>SIGMA INSIGHT</h1><div class="sub">Décider plus vite à partir des données de l'établissement.</div></div><button class="btn ghost" onclick="load()">Actualiser</button></div><div id="scope" class="muted">Chargement…</div><div id="kpis" class="grid"></div><div class="layout"><section class="card"><h2>À traiter maintenant</h2><div id="actions"></div></section><section class="card"><h2>Élèves prioritaires</h2><div id="risks"></div></section></div><p id="disclaimer" class="muted" style="margin-top:18px"></p></div></main><script src="/dashboard/assets/sigma.js"></script><script>
function esc(s){return Sigma.escapeHtml(s)}
function safeInternalHref(value){try{const u=new URL(String(value||''),location.origin);return u.origin===location.origin&&u.pathname.startsWith('/dashboard/')?u.pathname+u.search+u.hash:'/dashboard/';}catch(_){return '/dashboard/';}}
async function load(){try{const p=new URLSearchParams(location.search),ctx=Sigma.context.get();let school=p.get('school_id')||ctx.school_id;if(!school){document.getElementById('scope').textContent='Aucun établissement sélectionné.';return;}let url=`/api/dashboard/insight?school_id=${encodeURIComponent(school)}`;const y=p.get('academic_year_id')||ctx.academic_year_id,period=p.get('academic_period_id')||ctx.academic_period_id;if(y)url+=`&academic_year_id=${encodeURIComponent(y)}`;if(period)url+=`&academic_period_id=${encodeURIComponent(period)}`;const d=await Sigma.api(url),k=d.kpis;document.getElementById('scope').textContent=`Établissement #${d.scope.school_id}`;const cards=[['Élèves actifs',k.active_students],['Moyenne générale',k.school_average==null?'—':k.school_average+'/20'],['Élèves prioritaires',k.critical_students],['Impayés en retard',k.overdue_invoices],['Absences non justifiées',k.unjustified_absences],['Retards',k.lates],['Recouvrement',k.collection_rate==null?'—':k.collection_rate+' %'],['Notes en brouillon',k.draft_grades]];document.getElementById('kpis').innerHTML=cards.map(x=>`<div class="card"><div class="label">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('');document.getElementById('actions').innerHTML=d.actions.length?d.actions.map(a=>`<div class="action"><span class="pill ${esc(a.priority)}">${esc(a.priority)}</span><strong> ${esc(a.title)}</strong><div class="muted">${esc(a.count)} élément(s)</div><a href="${safeInternalHref(a.href)}">${esc(a.action)} →</a></div>`).join(''):'<div class="muted">Aucune action prioritaire détectée.</div>';document.getElementById('risks').innerHTML=d.top_risks.length?d.top_risks.map(x=>`<div class="row"><span><strong>${esc(x.student_name)}</strong><br><span class="muted">${esc(x.reasons.join(' · ')||'Aucun motif')}</span></span><span class="pill ${esc(x.level)}">${Number(x.score)}</span></div>`).join(''):'<div class="muted">Aucun élève à surveiller sur le périmètre choisi.</div>';document.getElementById('disclaimer').textContent=d.disclaimer||'';}catch(e){document.getElementById('scope').textContent='Impossible de charger les indicateurs : '+e.message;}}
Sigma.boot('/dashboard/insight.html',load);
</script></body></html>
