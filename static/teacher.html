<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Espace Enseignant</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><link rel="manifest" href="/dashboard/manifest.webmanifest"></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><h2 class="page-title">Espace Enseignant</h2><p class="page-subtitle">Classes affectées, effectifs et saisies restant à compléter.</p><div id="kpis" class="kpi-grid"></div><div class="panels-grid"><div class="panel"><h3>Mes classes</h3><div id="classes"></div></div><div class="panel"><h3>Saisies à terminer</h3><div id="pending"></div></div></div></div></main><footer class="sigma-footer">SIGMA — Portail Enseignant</footer><script src="/dashboard/assets/sigma.js"></script><script>async function load(){try{const d=await Sigma.api('/api/teacher/overview');document.getElementById('kpis').innerHTML=`<div class="kpi"><div class="value">${d.kpis.classes}</div><div class="label">Classes</div></div><div class="kpi"><div class="value">${d.kpis.students}</div><div class="label">Élèves suivis</div></div><div class="kpi accent"><div class="value">${d.kpis.pending_grades}</div><div class="label">Notes restantes</div></div>`;document.getElementById('classes').innerHTML=d.classes.length?d.classes.map(c=>`<div class="list-row"><div><b>${Sigma.escapeHtml(c.class_name)}</b><div class="muted">${Sigma.escapeHtml(c.subject_name)}</div></div><strong>${c.student_count}</strong></div>`).join(''):'<div class="empty-state">Aucune affectation.</div>';document.getElementById('pending').innerHTML=d.pending_assessments.length?d.pending_assessments.map(a=>`<div class="list-row"><div><b>${Sigma.escapeHtml(a.name)}</b><div class="muted">${Sigma.escapeHtml(a.class_name)} · ${a.entered}/${a.total}</div></div><span class="badge danger">${a.remaining}</span></div>`).join(''):'<div class="empty-state">✓ Toutes les saisies sont à jour.</div>'}catch(e){Sigma.toast(e.message,'error')}} Sigma.boot('/dashboard/teacher.html',load);</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/dashboard/sw.js").catch(()=>{});</script></body></html>
