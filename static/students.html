<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Élèves</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><style>.photo-crop-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:9999}.photo-crop-panel{background:#fff;padding:20px;border-radius:14px;max-width:560px;width:calc(100% - 30px)}#crop-canvas{width:100%;max-width:500px;display:block;margin:auto;touch-action:none;cursor:grab}</style></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><h2 class="page-title">Élèves</h2><p class="page-subtitle">Inscription, fiche élève, photo, affectation et effectifs</p><div id="context-bar"></div><div class="panel"><div class="form-row"><div class="field"><label>Recherche</label><input id="search" placeholder="Nom, prénom ou matricule" onkeydown="if(event.key==='Enter')loadGrid()"></div><button class="btn" onclick="loadGrid()">Rechercher</button><button class="btn ghost" onclick="openCreateForm()">➕ Nouvel élève</button><button class="btn accent" onclick="exportPdf()">⬇️ PDF</button><button class="btn ghost" onclick="exportExcel()">⬇️ Excel</button></div></div><div id="create-form" class="panel" style="display:none"><h3>Fiche d'inscription</h3><div class="form-grid"><div class="field"><label>Matricule <span class="small">(automatique si vide)</span></label><input id="new-matricule" placeholder="Automatique"></div><div class="field"><label>Nom *</label><input id="new-last-name"></div><div class="field"><label>Prénom *</label><input id="new-first-name"></div><div class="field"><label>Date de naissance</label><input id="new-birth-date" type="date"></div><div class="field"><label>Lieu de naissance</label><input id="new-birth-place"></div><div class="field"><label>Sexe</label><select id="new-sex"><option value="">—</option><option>M</option><option>F</option></select></div><div class="field"><label>Quartier</label><input id="new-address"></div><div class="field"><label>Classe *</label><select id="new-class" onchange="previewClass()"></select></div><div class="field"><label>Niveau</label><input id="new-level" disabled></div><div class="field"><label>Section / série</label><input id="new-stream" disabled></div><div class="field"><label>Nom du parent / tuteur</label><input id="new-guardian-name" placeholder="Nom et prénom"></div><div class="field"><label>Lien</label><select id="new-guardian-rel"><option>père</option><option>mère</option><option>tuteur</option></select></div><div class="field"><label>Téléphone parent</label><input id="new-guardian-phone"></div><div class="field"><label>Photo</label><input id="new-photo" type="file" accept="image/jpeg,image/png"></div></div><button class="btn" onclick="createStudent()">Enregistrer l'élève</button><button class="btn ghost" onclick="closeCreateForm()">Annuler</button><div id="create-error" class="form-error"></div></div><div class="panel"><div class="form-row" style="justify-content:space-between"><h3 style="margin:0">Effectifs</h3><span id="count-label"></span></div><table class="sigma-table"><thead><tr><th>Photo</th><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Classe</th><th>Niveau</th><th>Section</th><th>Parent</th><th>Téléphone</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="grid-body"></tbody></table><div class="pagination"><button class="btn ghost sm" onclick="prevPage()">◀</button><span id="page-info">—</span><button class="btn ghost sm" onclick="nextPage()">▶</button></div></div></div><div id="profile-host" style="display:none"></div></main><footer class="sigma-footer">SIGMA — Système Intégré de Gestion et Management Académique</footer><script src="/dashboard/assets/sigma-offline.js"></script><script src="/dashboard/assets/sigma.js"></script><script>let offset=0,total=0,classes=[],levels=[],streams=[];const LIMIT=25;async function loadConfig(){const c=Sigma.context.get();[classes,levels,streams]=await Promise.all([Sigma.api(`/api/classes?school_id=${c.school_id}&academic_year_id=${c.academic_year_id}`),Sigma.api(`/api/levels?school_id=${c.school_id}`),Sigma.api(`/api/streams?school_id=${c.school_id}`)]);document.getElementById('new-class').innerHTML=classes.map(x=>`<option value="${Number(x.id)}">${Sigma.escapeHtml(x.name)}</option>`).join('');previewClass()}async function previewMatricule(){const c=Sigma.context.get(),classId=Number(document.getElementById('new-class').value);if(!classId)return;try{const d=await Sigma.api(`/api/students/matricule/preview?class_id=${classId}&academic_year_id=${c.academic_year_id}`);document.getElementById('new-matricule').placeholder=d.matricule; }catch(e){}}function previewClass(){const c=classes.find(x=>x.id==document.getElementById('new-class').value);document.getElementById('new-level').value=levels.find(x=>x.id===c?.level_id)?.name||'—';document.getElementById('new-stream').value=streams.find(x=>x.id===c?.stream_id)?.name||'—';previewMatricule()}async function loadGrid(){const c=Sigma.context.get();let u=`/api/students/grid?school_id=${c.school_id}&limit=${LIMIT}&offset=${offset}`;if(c.class_id)u+=`&class_id=${c.class_id}`;const q=document.getElementById('search').value.trim();if(q)u+=`&search=${encodeURIComponent(q)}`;try{const d=await Sigma.api(u);total=d.total;document.getElementById('count-label').textContent=`${total} élève(s)`;document.getElementById('grid-body').innerHTML=d.items.map(s=>{const cl=classes.find(x=>x.name===s.class_name);const lv=levels.find(x=>x.id===cl?.level_id)?.name||'—';const st=streams.find(x=>x.id===cl?.stream_id)?.name||'—';return `<tr><td>${s.has_photo?`<img class="photo-thumb" id="ph-${s.id}">`:'📷'}</td><td>${Sigma.escapeHtml(s.matricule)}</td><td>${Sigma.escapeHtml(s.last_name)}</td><td>${Sigma.escapeHtml(s.first_name)}</td><td>${Sigma.escapeHtml(s.class_name||'—')}</td><td>${Sigma.escapeHtml(lv)}</td><td>${Sigma.escapeHtml(st)}</td><td>${Sigma.escapeHtml(s.guardian_name||'—')}</td><td>${Sigma.escapeHtml(s.guardian_phone||'—')}</td><td><span class="badge ${s.status==='active'?'green':'grey'}">${Sigma.escapeHtml(s.status)}</span></td><td>${s.status==='active'?`<button class="btn danger sm" onclick="withdraw(${s.id})">Retirer</button>`:''} <button class="btn ghost sm" onclick="uploadPhoto(${s.id})">📷</button> <button class="btn ghost sm" onclick="openProfile(${s.id})">360°</button> <button class="btn ghost sm" onclick="downloadCard(${s.id})">Carte</button> <button class="btn ghost sm" onclick="downloadDossier(${s.id})">Dossier PDF</button></td></tr>`}).join('')||'<tr><td colspan="11">Aucun élève.</td></tr>';d.items.filter(s=>s.has_photo).forEach(s=>Sigma.loadImageInto(document.getElementById(`ph-${s.id}`),`/api/students/${s.id}/photo`)) ;document.getElementById('page-info').textContent=`${total?offset+1:0}–${Math.min(offset+LIMIT,total)} / ${total}`}catch(e){Sigma.toast(e.message,'error')}}function prevPage(){if(offset>=LIMIT){offset-=LIMIT;loadGrid()}}function nextPage(){if(offset+LIMIT<total){offset+=LIMIT;loadGrid()}}async function openProfile(id){
try{const d=await Sigma.api(`/api/students/${id}/profile`); const s=d.student; const current=d.current_enrollment;
let html=`<div class="panel profile-panel"><div class="form-row" style="justify-content:space-between"><div><h3 style="margin:0">${Sigma.escapeHtml(s.first_name)} ${Sigma.escapeHtml(s.last_name)}</h3><div>${Sigma.escapeHtml(s.matricule)} · ${Sigma.escapeHtml(current?.class_name||'Sans classe')} · <span class="badge ${s.status==='active'?'green':'grey'}">${Sigma.escapeHtml(s.status)}</span></div></div><button class="btn ghost" onclick="closeProfile()">Fermer</button></div>`;
html+=`<div class="form-grid"><div><b>Naissance</b><br>${Sigma.escapeHtml(s.birth_date||'—')} ${s.birth_place?'· '+Sigma.escapeHtml(s.birth_place):''}</div><div><b>Sexe</b><br>${Sigma.escapeHtml(s.sex||'—')}</div><div><b>Nationalité</b><br>${Sigma.escapeHtml(s.nationality||'—')}</div><div><b>Adresse</b><br>${Sigma.escapeHtml(s.address||'—')}</div></div>`;
html+=`<h4>Parents / tuteurs</h4><table class="sigma-table"><thead><tr><th>Nom</th><th>Lien</th><th>Téléphone</th><th>Retrait</th><th>Principal</th></tr></thead><tbody>${d.guardians.map(g=>`<tr><td>${Sigma.escapeHtml(g.first_name)} ${Sigma.escapeHtml(g.last_name)}</td><td>${Sigma.escapeHtml(g.relationship_type)}</td><td>${Sigma.escapeHtml(g.phone||'—')}</td><td>${g.can_pick_up_child?'Oui':'Non'}</td><td>${g.is_primary_contact?'Oui':'—'}</td></tr>`).join('')||'<tr><td colspan="5">Aucun responsable.</td></tr>'}</tbody></table>`;
html+=`<h4>Historique scolaire</h4><table class="sigma-table"><thead><tr><th>Année</th><th>Classe</th><th>Début</th><th>Fin</th><th>Type</th></tr></thead><tbody>${d.enrollment_history.map(m=>`<tr><td>${Sigma.escapeHtml(m.academic_year_id)}</td><td>${Sigma.escapeHtml(m.class_name||'—')}</td><td>${Sigma.escapeHtml(m.enrolled_at)}</td><td>${Sigma.escapeHtml(m.left_at||'En cours')}</td><td>${Sigma.escapeHtml(m.enrollment_type)}</td></tr>`).join('')||'<tr><td colspan="5">Aucune inscription.</td></tr>'}</tbody></table></div>`;
const host=document.getElementById('profile-host')||Object.assign(document.createElement('div'),{id:'profile-host'});if(!host.parentNode)document.body.appendChild(host);host.innerHTML=html;host.style.display='block';host.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){Sigma.toast(e.message,'error')}}
function closeProfile(){const h=document.getElementById('profile-host');if(h)h.style.display='none'}function open360(id){window.location.href=`/dashboard/student360.html?student_id=${id}`}function openProfile(id){open360(id)}
async function downloadDossier(id){try{await Sigma.downloadBlob(`/api/students/${id}/documents/dossier.pdf`,`dossier_${id}.pdf`);Sigma.toast('Dossier PDF généré')}catch(e){Sigma.toast(e.message,'error')}}


function openCreateForm(){document.getElementById('create-form').style.display='block';loadConfig()}function closeCreateForm(){document.getElementById('create-form').style.display='none'}async function createStudent(){const c=Sigma.context.get(),err=document.getElementById('create-error');err.textContent='';const gn=document.getElementById('new-guardian-name').value.trim().split(/\s+/),p={school_id:+c.school_id,matricule:new String(document.getElementById('new-matricule').value).trim()||null,first_name:document.getElementById('new-first-name').value.trim(),last_name:document.getElementById('new-last-name').value.trim(),birth_date:document.getElementById('new-birth-date').value||null,birth_place:document.getElementById('new-birth-place').value||null,sex:document.getElementById('new-sex').value||null,address:document.getElementById('new-address').value||null,class_id:+document.getElementById('new-class').value,academic_year_id:+c.academic_year_id,guardian_first_name:gn.shift()||null,guardian_last_name:gn.join(' ')||null,guardian_relationship:document.getElementById('new-guardian-rel').value,guardian_phone:document.getElementById('new-guardian-phone').value||null};if(!p.first_name||!p.last_name||!p.class_id){err.textContent='Nom, prénom et classe sont obligatoires.';return}const original=document.getElementById('new-photo').files[0];let cropped=null;if(original){cropped=await new Promise(resolve=>openPhotoCropper(original,resolve))}try{const st=await Sigma.postJson('/api/students',p);if(st.offline){Sigma.toast('Élève enregistré localement — synchronisation en attente');closeCreateForm();loadGrid();return}if(cropped){const fd=new FormData();fd.append('file',cropped,'student-'+st.id+'.jpg');await Sigma.api(`/api/students/${st.id}/photo`,{method:'POST',body:fd})}document.getElementById('new-matricule').value=st.matricule||'';Sigma.toast('Élève enregistré');closeCreateForm();loadGrid()}catch(e){err.textContent=e.message}}async function uploadPhoto(id){const input=document.createElement('input');input.type='file';input.accept='image/jpeg,image/png';input.onchange=async()=>{if(!input.files[0])return;openPhotoCropper(input.files[0],async blob=>{const fd=new FormData();fd.append('file',blob,'student-'+id+'.jpg');try{await Sigma.api(`/api/students/${id}/photo`,{method:'POST',body:fd});Sigma.toast('Photo enregistrée au format 4×4');loadGrid()}catch(e){Sigma.toast(e.message,'error')}})};input.click()}
function openPhotoCropper(file,onDone){const url=URL.createObjectURL(file),wrap=document.createElement('div');wrap.className='photo-crop-modal';wrap.innerHTML='<div class="photo-crop-panel"><h3>Recadrer la photo — format 4×4</h3><canvas id="crop-canvas" width="500" height="500"></canvas><div class="form-row"><label>Zoom <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"></label><button class="btn" id="crop-ok">Valider</button><button class="btn ghost" id="crop-cancel">Annuler</button></div><p class="small">Faites glisser la photo pour positionner le visage dans le carré. Le résultat sera carré.</p></div>';document.body.appendChild(wrap);const canvas=wrap.querySelector('#crop-canvas'),ctx=canvas.getContext('2d'),zoom=wrap.querySelector('#crop-zoom');const img=new Image();let scale=1,base=1,ox=0,oy=0,drag=false,lx=0,ly=0;img.onload=()=>{base=Math.max(canvas.width/img.width,canvas.height/img.height);scale=base;ox=(canvas.width-img.width*scale)/2;oy=(canvas.height-img.height*scale)/2;draw()};img.src=url;function draw(){ctx.clearRect(0,0,500,500);ctx.save();ctx.fillStyle='#111';ctx.fillRect(0,0,500,500);ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.drawImage(img,0,0);ctx.restore();ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,500,40);ctx.fillRect(0,460,500,40);ctx.fillRect(0,40,40,420);ctx.fillRect(460,40,40,420);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(40,40,420,420)}function setZoom(){const z=Number(zoom.value);const old=scale;scale=base*z;const cx=250,cy=250;ox=cx-(cx-ox)*(scale/old);oy=cy-(cy-oy)*(scale/old);draw()}zoom.oninput=setZoom;canvas.onpointerdown=e=>{drag=true;canvas.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY};canvas.onpointermove=e=>{if(!drag)return;ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;draw()};canvas.onpointerup=()=>drag=false;canvas.onpointercancel=()=>drag=false;wrap.querySelector('#crop-cancel').onclick=()=>{URL.revokeObjectURL(url);wrap.remove()};wrap.querySelector('#crop-ok').onclick=async()=>{const out=document.createElement('canvas'),o=out.getContext('2d');out.width=600;out.height=600;o.fillStyle='#fff';o.fillRect(0,0,600,600);const sourceX=(40-ox)/scale,sourceY=(40-oy)/scale,sourceSide=420/scale;o.drawImage(img,sourceX,sourceY,sourceSide,sourceSide,0,0,600,600);out.toBlob(async b=>{URL.revokeObjectURL(url);wrap.remove();if(b)await onDone(b)},'image/jpeg',.9)};}
async function withdraw(id){if(!confirm('Retirer cet élève des effectifs actuels ?'))return;try{await Sigma.api(`/api/students/${id}/withdraw`,{method:'POST'});Sigma.toast('Élève retiré des effectifs');loadGrid()}catch(e){Sigma.toast(e.message,'error')}}async function downloadCard(id){try{const cards=await Sigma.api(`/api/id-cards?school_id=${Sigma.context.get().school_id}&student_id=${id}`);if(!cards.length){Sigma.toast('Aucune carte émise pour cet élève','error');return}await Sigma.downloadBlob(`/api/id-cards/${cards[0].id}/download.pdf`,`${cards[0].card_number}.pdf`)}catch(e){Sigma.toast(e.message,'error')}}async function exportPdf(){const c=Sigma.context.get();await Sigma.downloadBlob(`/api/students/export.pdf?school_id=${c.school_id}`,'liste_eleves.pdf')}async function exportExcel(){const c=Sigma.context.get();await Sigma.downloadBlob(`/api/students/export.xlsx?school_id=${c.school_id}`,'eleves.xlsx')}Sigma.boot('/dashboard/students.html',async()=>{await Sigma.renderContextBar('context-bar',{showClass:true,showPeriod:false},async()=>{await loadConfig();await loadGrid()})})</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/dashboard/sw.js").catch(()=>{});}</script></body></html>
