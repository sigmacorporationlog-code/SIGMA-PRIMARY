<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Élève 360</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><style>
.student-hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.student-photo{width:92px;height:92px;border-radius:14px;object-fit:cover;background:#eef2f2;border:1px solid var(--border);display:grid;place-items:center;font-size:32px}.student-meta h2{margin:0 0 6px;color:var(--primary)}.student-meta p{margin:3px 0;color:var(--text-muted);font-size:13px}.quick-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}.mini-card{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--card)}.mini-card .n{font-size:22px;font-weight:800;color:var(--primary)}.mini-card .l{font-size:11px;color:var(--text-muted);margin-top:3px}.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.timeline td:first-child{white-space:nowrap}.muted{color:var(--text-muted)}.danger-text{color:var(--danger);font-weight:700}.success-text{color:var(--primary);font-weight:700}@media(max-width:900px){.student-hero{grid-template-columns:auto 1fr}.quick-actions{grid-column:1/-1;justify-content:flex-start}.mini-grid{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr}}
</style></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><h2 class="page-title">Élève 360</h2><p class="page-subtitle">Une vue longitudinale du dossier administratif, pédagogique, financier et documentaire.</p><div id="context-bar"></div><div id="loading" class="panel">Chargement du dossier…</div><div id="student-host"></div></div></main><footer class="sigma-footer">SIGMA — Système Intégré de Gestion et Management Académique</footer><script src="/dashboard/assets/sigma-offline.js"></script><script src="/dashboard/assets/sigma.js"></script><script>
const params=new URLSearchParams(location.search);const studentId=Number(params.get('student_id')||0);let data=null;
function esc(v){return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v){if(v==null)return '—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('fr-FR',{maximumFractionDigits:2}):esc(v)}
function badge(state){const cls=state==='active'||state===true?'green':state==='published'?'green':state==='cancelled'||state==='revoked'?'red':'grey';return `<span class="badge ${cls}">${esc(state===true?'Oui':state)}</span>`}
function photoUrl(id){return `/api/students/${id}/photo`}
function render(){const d=data,s=d.student,e=d.current_enrollment;const grades=d.pedagogy?.recent_grades||[],reports=d.pedagogy?.report_cards||[],att=d.attendance||[],disc=d.discipline||[],inv=d.finance?.invoices||[],pay=d.finance?.payments||[],cards=d.cards||[];const absent=att.filter(x=>String(x.status||'').toLowerCase().includes('abs')).length;const unpaid=inv.filter(x=>!['paid','cancelled'].includes(String(x.status||'').toLowerCase())).length;document.getElementById('student-host').innerHTML=`
<div class="panel student-hero"><div class="student-photo" id="student-photo">👤</div><div class="student-meta"><h2>${esc(s.first_name)} ${esc(s.last_name)}</h2><p><strong>${esc(s.matricule)}</strong> · ${esc(e?.class_name||'Sans classe')} · ${badge(s.status)}</p><p>${esc(s.birth_date||'Date de naissance inconnue')} · ${esc(s.sex||'Sexe non renseigné')} · ${esc(s.address||'Adresse non renseignée')}</p></div><div class="quick-actions"><button class="btn ghost" onclick="window.location.href='/dashboard/students.html'">← Élèves</button><button class="btn ghost" onclick="downloadDossier()">📄 Dossier PDF</button><button class="btn ghost" onclick="goCard()">🪪 Badge</button></div></div>
<div class="mini-grid"><div class="mini-card"><div class="n">${grades.length}</div><div class="l">Évaluations récentes</div></div><div class="mini-card"><div class="n">${reports.length}</div><div class="l">Bulletins</div></div><div class="mini-card"><div class="n">${absent}</div><div class="l">Absences affichées</div></div><div class="mini-card"><div class="n">${unpaid}</div><div class="l">Factures non soldées</div></div></div>
<div class="tabs"><button class="active" onclick="showTab('overview',this)">Synthèse</button><button onclick="showTab('pedagogy',this)">Pédagogie</button><button onclick="showTab('attendance',this)">Présence</button><button onclick="showTab('finance',this)">Finance</button><button onclick="showTab('admin',this)">Administratif</button></div>
<div id="tab-overview" class="tab-content"><div class="section-grid"><div class="panel"><h3>Responsables</h3><table class="sigma-table"><thead><tr><th>Nom</th><th>Lien</th><th>Téléphone</th><th>Principal</th></tr></thead><tbody>${(d.guardians||[]).map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.relationship)}</td><td>${esc(g.phone)}</td><td>${g.is_primary?'Oui':'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucun responsable.</td></tr>'}</tbody></table></div><div class="panel"><h3>Dernières opérations</h3><table class="sigma-table"><thead><tr><th>Type</th><th>Détail</th><th>État</th></tr></thead><tbody>${pay.slice(0,5).map(p=>`<tr><td>Paiement</td><td>${fmt(p.amount)} · ${esc(p.method)}</td><td>${p.is_cancelled?'<span class="danger-text">Annulé</span>':'<span class="success-text">Enregistré</span>'}</td></tr>`).join('')}${cards.slice(0,3).map(c=>`<tr><td>Badge</td><td>${esc(c.card_number)}</td><td>${badge(c.status)}</td></tr>`).join('')||''}</tbody></table></div></div></div>
<div id="tab-pedagogy" class="tab-content" style="display:none"><div class="panel"><h3>Résultats récents</h3><table class="sigma-table"><thead><tr><th>Évaluation</th><th>Note</th><th>État</th><th>Appréciation</th></tr></thead><tbody>${grades.map(g=>`<tr><td>#${g.assessment_id}</td><td><strong>${fmt(g.score)}</strong></td><td>${badge(g.state)}</td><td>${esc(g.comment)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucune note récente.</td></tr>'}</tbody></table></div><div class="panel"><h3>Bulletins</h3><table class="sigma-table"><thead><tr><th>Bulletin</th><th>Moyenne</th><th>Rang</th><th>Publication</th></tr></thead><tbody>${reports.map(r=>`<tr><td>#${r.id}</td><td>${fmt(r.general_average)}</td><td>${esc(r.class_rank)}</td><td>${r.published?badge('published'):badge('draft')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucun bulletin.</td></tr>'}</tbody></table></div></div>
<div id="tab-attendance" class="tab-content" style="display:none"><div class="panel"><h3>Présence récente</h3><table class="sigma-table"><thead><tr><th>Date</th><th>Statut</th><th>Justifiée</th><th>Motif</th></tr></thead><tbody>${att.map(a=>`<tr><td>${esc(a.date)}</td><td>${badge(a.status)}</td><td>${a.justified?'Oui':'Non'}</td><td>${esc(a.reason)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucun enregistrement.</td></tr>'}</tbody></table></div><div class="panel"><h3>Discipline</h3><table class="sigma-table"><thead><tr><th>Date</th><th>Type</th><th>Gravité</th><th>Description</th></tr></thead><tbody>${disc.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.severity)}</td><td>${esc(x.description)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucun incident.</td></tr>'}</tbody></table></div></div>
<div id="tab-finance" class="tab-content" style="display:none"><div class="section-grid"><div class="panel"><h3>Factures</h3><table class="sigma-table"><thead><tr><th>ID</th><th>Échéance</th><th>Montant dû</th><th>État</th></tr></thead><tbody>${inv.map(i=>`<tr><td>#${i.id}</td><td>${esc(i.due_date)}</td><td>${fmt(i.amount_due)}</td><td>${badge(i.status)}</td></tr>`).join('')||'<tr><td colspan="4">Aucune facture.</td></tr>'}</tbody></table></div><div class="panel"><h3>Paiements</h3><table class="sigma-table"><thead><tr><th>ID</th><th>Date</th><th>Montant</th><th>Mode</th></tr></thead><tbody>${pay.map(p=>`<tr><td>#${p.id}</td><td>${esc(p.paid_at)}</td><td>${fmt(p.amount)}</td><td>${esc(p.method)}</td></tr>`).join('')||'<tr><td colspan="4">Aucun paiement.</td></tr>'}</tbody></table></div></div></div>
<div id="tab-admin" class="tab-content" style="display:none"><div class="section-grid"><div class="panel"><h3>Identité</h3><div class="form-grid"><div><b>Nom</b><br>${esc(s.last_name)}</div><div><b>Prénom</b><br>${esc(s.first_name)}</div><div><b>Matricule</b><br>${esc(s.matricule)}</div><div><b>Naissance</b><br>${esc(s.birth_date)}</div><div><b>Sexe</b><br>${esc(s.sex)}</div><div><b>Statut</b><br>${badge(s.status)}</div></div></div><div class="panel"><h3>Scolarité</h3><table class="sigma-table"><thead><tr><th>Année</th><th>Classe</th><th>Entrée</th><th>Sortie</th></tr></thead><tbody>${(d.school_history||[]).map(m=>`<tr><td>${esc(m.academic_year_id)}</td><td>${esc(m.class_name)}</td><td>${esc(m.enrolled_at)}</td><td>${esc(m.left_at||'En cours')}</td></tr>`).join('')||'<tr><td colspan="4">Aucun historique.</td></tr>'}</tbody></table></div></div><div class="panel"><h3>Badges & documents</h3><table class="sigma-table"><thead><tr><th>Badge</th><th>État</th></tr></thead><tbody>${cards.map(c=>`<tr><td>${esc(c.card_number)}</td><td>${badge(c.status)}</td></tr>`).join('')||'<tr><td colspan="2">Aucun badge.</td></tr>'}</tbody></table></div></div>`;Sigma.loadImageInto(document.getElementById('student-photo'),photoUrl(s.id)).catch(()=>{});}
function showTab(name,btn){document.querySelectorAll('.tab-content').forEach(x=>x.style.display='none');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+name).style.display='block';btn.classList.add('active')}
async function load(){if(!studentId){document.getElementById('loading').textContent='Identifiant élève manquant.';return}try{data=await Sigma.api(`/api/students/${studentId}/360?academic_year_id=${Sigma.context.get().academic_year_id||''}`);document.getElementById('loading').style.display='none';render()}catch(e){document.getElementById('loading').textContent=e.message;Sigma.toast(e.message,'error')}}
async function downloadDossier(){try{await Sigma.downloadBlob(`/api/students/${studentId}/documents/dossier.pdf`,`dossier_${studentId}.pdf`)}catch(e){Sigma.toast(e.message,'error')}}
async function goCard(){location.href=`/dashboard/cards.html?student_id=${studentId}`}
Sigma.boot('/dashboard/student360.html',async()=>{await Sigma.renderContextBar('context-bar',{showClass:false,showPeriod:false},load)})
</script></body></html>
