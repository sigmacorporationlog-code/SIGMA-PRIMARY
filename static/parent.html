<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Espace Parent</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"><link rel="manifest" href="/dashboard/manifest.webmanifest"></head><body><div id="sigma-header"></div><div id="login-screen"></div><main id="main-screen" style="display:none"><div class="sigma-main"><h2 class="page-title">Espace Parent</h2><p class="page-subtitle">Suivez les résultats, la présence et la situation financière de vos enfants.</p><div id="parent-info" class="panel"></div><div class="panel"><div class="section-head"><div><h3>Mes enfants</h3><p class="muted">Sélectionnez un enfant pour consulter son suivi.</p></div><select id="child-select" onchange="loadChild()"></select></div></div><div id="child-content"></div></div></main><footer class="sigma-footer">SIGMA — Portail Parent</footer><script src="/dashboard/assets/sigma.js"></script><script>
let children=[]; async function load(){try{const me=await Sigma.api('/api/parent/me');document.getElementById('parent-info').innerHTML=`<b>${Sigma.escapeHtml(me.first_name)} ${Sigma.escapeHtml(me.last_name)}</b> · ${Sigma.escapeHtml(me.relationship_type)}`;children=await Sigma.api('/api/parent/children');document.getElementById('child-select').innerHTML=children.map(c=>`<option value="${Number(c.id)}">${Sigma.escapeHtml(c.first_name)} ${Sigma.escapeHtml(c.last_name)} — ${Sigma.escapeHtml(c.matricule)}</option>`).join('')||'<option>Aucun enfant lié</option>';if(children.length)loadChild()}catch(e){Sigma.toast(e.message,'error')}} async function loadChild(){const id=document.getElementById('child-select').value;if(!id)return;try{const d=await Sigma.api(`/api/parent/children/${id}/overview`);const a=d.attendance,f=d.finance;document.getElementById('child-content').innerHTML=`<div class="kpi-grid"><div class="kpi"><div class="value">${Sigma.escapeHtml(d.class?.name||'—')}</div><div class="label">Classe</div></div><div class="kpi"><div class="value">${a.present}</div><div class="label">Présences</div></div><div class="kpi"><div class="value">${a.absent}</div><div class="label">Absences</div></div><div class="kpi"><div class="value">${f.balance.toLocaleString('fr-FR')} XAF</div><div class="label">Solde restant</div></div></div><div class="panels-grid"><div class="panel"><h3>Bulletins publiés</h3>${d.report_cards.length?d.report_cards.map(r=>`<div class="list-row"><div><b>${Sigma.escapeHtml(r.period_name)}</b><div class="muted">${Sigma.escapeHtml(r.appreciation||'Aucune appréciation')}</div></div><strong>${r.average??'—'}/20</strong></div>`).join(''):'<div class="empty-state">Aucun bulletin publié.</div>'}</div><div class="panel"><h3>Dernières notes</h3>${d.recent_grades.length?d.recent_grades.slice(0,10).map(g=>`<div class="list-row"><div><b>${Sigma.escapeHtml(g.subject)}</b><div class="muted">${Sigma.escapeHtml(g.assessment)}</div></div><strong>${Sigma.escapeHtml(g.score??'—')}/${Sigma.escapeHtml(g.max_score??20)}</strong></div>`).join(''):'<div class="empty-state">Aucune note publiée.</div>'}</div></div>`}catch(e){Sigma.toast(e.message,'error')}} Sigma.boot('/dashboard/parent.html',load);</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/dashboard/sw.js").catch(()=>{});</script></body></html>
