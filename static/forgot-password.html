<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA — Mot de passe oublié</title><link rel="icon" href="/dashboard/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/assets/favicon-32.png">
<link rel="stylesheet" href="/dashboard/assets/sigma.css"></head><body><main class="sigma-main" style="max-width:620px;margin:60px auto"><div class="panel"><h2>📩 Mot de passe oublié</h2><p>Saisissez votre identifiant ou votre adresse email. Si un compte correspond et que la récupération par email est configurée, SIGMA enverra un lien.</p><div class="field"><label>Identifiant ou email</label><input id="identifier" autocomplete="username"></div><button class="btn" id="send">Envoyer le lien</button><div id="msg" class="form-error"></div><p><a href="/dashboard/">Retour à la connexion</a></p></div></main><script>document.getElementById('send').onclick=async()=>{const m=document.getElementById('msg');m.textContent='';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('identifier').value})});const d=await r.json();m.className='';m.textContent=d.message||'Si un compte correspond, un message sera envoyé.';}catch(e){m.textContent='Demande impossible. Réessayez plus tard.';}};</script></body></html>
